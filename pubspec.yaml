name: pda_mobile
description: A Flutter plugin for the built-in BLD N60 barcode scanner.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.example.pda_mobile
        pluginClass: PdaMobilePlugin
